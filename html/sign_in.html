<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W8 — Sign In</title>
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background layers -->
  <div class="bg-layer bg-overlay"></div>
  <div class="bg-layer bg-grid"></div>
  <div class="bg-layer bg-diagonal"></div>

  <!-- Animated corner accents -->
  <span class="corner corner--tl"></span>
  <span class="corner corner--br"></span>

  <!-- Floating stat pills -->
  <div class="stat-pill stat-pill--left">
    <span class="stat-num">2,400+</span>
    <span class="stat-label">Active Members</span>
  </div>
  <div class="stat-pill stat-pill--right">
    <span class="stat-num">48</span>
    <span class="stat-label">Weekly Classes</span>
  </div>

  <main class="auth-shell">

    <!-- Brand -->
    <div class="brand">
      <div class="brand__icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="16" width="8" height="8" rx="1" fill="currentColor"/>
          <rect x="30" y="16" width="8" height="8" rx="1" fill="currentColor"/>
          <rect x="10" y="10" width="4" height="20" rx="1" fill="currentColor"/>
          <rect x="26" y="10" width="4" height="20" rx="1" fill="currentColor"/>
          <rect x="14" y="18" width="12" height="4" rx="1" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand__text">
        <span class="brand__name">W8</span>
      </div>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <!-- Tab switcher -->
      <div class="tabs" role="tablist">
        <a class="tab tab--active" role="tab" aria-selected="true" aria-controls="panel-login" href="sign_in.html">Sign In</a>
        <a class="tab" href="register.html">Register</a>
        <span class="tab-indicator tab-indicator--left"></span>
      </div>

      <!-- Login Panel -->
      <div class="panel panel--active" id="panel-login" role="tabpanel">

        <form class="form" method="post" action="#" novalidate>

          <div class="field">
            <label class="field__label" for="login-email">Email / Username</label>
            <div class="field__wrap">
              <svg class="field__icon" viewBox="0 0 20 20" fill="none"><path d="M2.5 5.5A1.5 1.5 0 014 4h12a1.5 1.5 0 011.5 1.5v9A1.5 1.5 0 0116 16H4a1.5 1.5 0 01-1.5-1.5v-9z" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 6l7.5 5 7.5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <input class="field__input" type="text" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="login-password">Password</label>
            <div class="field__wrap">
              <svg class="field__icon" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M7 9V6.5a3 3 0 016 0V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="13" r="1.2" fill="currentColor"/></svg>
              <input class="field__input" type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <a href="#forgot" class="field__link field__link--end">Forgot password?</a>
          </div>

          <div class="field field--inline">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember">
              <span class="checkbox__box"></span>
              <span class="checkbox__label">Keep me signed in</span>
            </label>
          </div>

          <button class="btn-submit" type="submit">
            <span class="btn-submit__text">Continue</span>
            <svg class="btn-submit__arrow" viewBox="0 0 20 20" fill="none"><path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div class="role-hint">
            <span class="role-hint__label">Sign in as:</span>
            <label class="role-chip">
              <input type="radio" name="role" value="member" checked>
              Member
            </label>
            <label class="role-chip">
              <input type="radio" name="role" value="trainer">
              Trainer
            </label>
            <label class="role-chip">
              <input type="radio" name="role" value="admin">
              Admin
            </label>
          </div>

        </form>
      </div>

    </div>
    <!-- /auth-card -->

    <footer class="auth-footer">
      &copy; W8 — All rights reserved
    </footer>

  </main>

</body>
</html>
